# 서버 한 대용 단일 프로세스 구성. 로그는 로컬 디스크에 15일 보관한다
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-10-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 360h        # 15일
  # 사용자 수 쿼리는 사용자(IP+User-Agent)마다 시계열을 하나씩 만든다. 기본 500이면 7일 사용자가 500명을 넘을 때 실패한다
  max_query_series: 20000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
