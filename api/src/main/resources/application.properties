spring.application.name=bingang-api

# DB 접속 정보는 환경 변수로 받는다 (.env → compose → 컨테이너)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bingang}
spring.datasource.username=${DB_USER:bingang}
spring.datasource.password=${DB_PASSWORD:bingang}

# 스키마는 Flyway가 만든다. JPA는 엔티티와 테이블이 맞는지만 검사
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 지표는 Compose 내부의 Prometheus만 가져간다 (Caddy는 /api/*만 전달하므로 외부에 노출되지 않음)
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=bingang-api
# p95 계산용 응답 시간 히스토그램
management.metrics.distribution.percentiles-histogram.http.server.requests=true

spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s

# 학사 일정 수집 (하루 1회, 실패하면 기존 데이터 유지)
bingang.calendar.enabled=${CALENDAR_ENABLED:true}
bingang.calendar.url=https://www.yu.ac.kr/main/bachelor/calendar.do
bingang.calendar.cron=0 0 5 * * *

# 시간표 수집 (주 1회, 요일 6 × 시간 칸 24 = 144회 요청, 1초 간격)
# 계정은 .env의 YU_USERNO, YU_PASSWD로만 받는다. 학기가 바뀌면 TIMETABLE_YEAR, TIMETABLE_SEMESTER_CODE를 바꾼다
spring.task.scheduling.pool.size=2
bingang.timetable.enabled=${TIMETABLE_ENABLED:true}
bingang.timetable.base-url=https://std.yu.ac.kr
bingang.timetable.user-no=${YU_USERNO:}
bingang.timetable.password=${YU_PASSWD:}
bingang.timetable.year=${TIMETABLE_YEAR:2026}
bingang.timetable.semester-code=${TIMETABLE_SEMESTER_CODE:U0320021}
bingang.timetable.request-interval=1s
bingang.timetable.cron=0 0 4 * * MON

# 목록에서 숨길 건물 (A00 YU Metro Square, G19 안전교육체험장). 시간표 수집 때 반영된다
bingang.building.hidden-codes=A00,G19
