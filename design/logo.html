<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>빈강 로고 시안</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{--brand:#4f5bd5;--free:#15a86b;--ink:#191f28;--muted:#8b95a1;--line:#eef0f3}
*{box-sizing:border-box;margin:0}
body{font-family:"Pretendard",-apple-system,sans-serif;background:#fff;color:var(--ink);padding:32px 16px;-webkit-font-smoothing:antialiased}
h1{font-size:22px;font-weight:600;letter-spacing:-.03em;max-width:880px;margin:0 auto}
h1+p{font-size:13px;color:var(--muted);max-width:880px;margin:4px auto 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px;max-width:880px;margin:24px auto 0}
.opt{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.opt h2{font-size:15px;font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line)}
.opt h2 span{font-weight:400;color:var(--muted);margin-left:6px;font-size:13px}
.row{display:flex;align-items:center;gap:24px;padding:20px 16px}
.row.dark{background:#17171c;color:#ececee;--ink:#ececee;--brand:#8a93f0;--free:#2fc584}
.lock{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700;letter-spacing:-.05em}
.sizes{margin-left:auto;display:flex;align-items:end;gap:12px}
svg{display:block}
</style></head>
<body>
<h1>빈강 로고 시안</h1>
<p>각 시안: 앱 아이콘(64) · 헤더 로고 · 파비콘 크기(32 / 16). 위는 라이트, 아래는 다크.</p>

<svg width="0" height="0" style="position:absolute">
  <!-- A. 2×2 정돈형: 같은 크기 칸 3개 + 빈 칸 -->
  <symbol id="A" viewBox="0 0 32 32">
    <rect x="3" y="3" width="12" height="12" rx="3.5" style="fill:var(--brand)"/>
    <rect x="17" y="3" width="12" height="12" rx="3.5" style="fill:var(--brand)" opacity=".55"/>
    <rect x="3" y="17" width="12" height="12" rx="3.5" style="fill:var(--brand)" opacity=".3"/>
    <rect x="17.75" y="17.75" width="10.5" height="10.5" rx="2.75" fill="none" stroke-width="1.5" stroke-dasharray="2.6 2" style="stroke:var(--free)"/>
    <circle cx="23" cy="23" r="2.2" style="fill:var(--free)"/>
  </symbol>
  <!-- B. 타일형: 인디고 바탕에 흰 칸 3개, 한 칸은 비어서 초록 점만 -->
  <symbol id="B" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="8" style="fill:var(--brand)"/>
    <rect x="7" y="7" width="8" height="8" rx="2.2" fill="#fff"/>
    <rect x="17" y="7" width="8" height="8" rx="2.2" fill="#fff" opacity=".7"/>
    <rect x="7" y="17" width="8" height="8" rx="2.2" fill="#fff" opacity=".45"/>
    <circle cx="21" cy="21" r="2.4" fill="#3ee09a"/>
  </symbol>
  <!-- C. 시간표 열형: 월·화·수 세 줄, 가운데 줄에 빈 시간 -->
  <symbol id="C" viewBox="0 0 32 32">
    <rect x="3" y="3" width="7.5" height="15" rx="2.6" style="fill:var(--brand)"/>
    <rect x="3" y="20" width="7.5" height="9" rx="2.6" style="fill:var(--brand)" opacity=".45"/>
    <rect x="12.25" y="3" width="7.5" height="7" rx="2.6" style="fill:var(--brand)" opacity=".45"/>
    <rect x="12.25" y="22" width="7.5" height="7" rx="2.6" style="fill:var(--brand)"/>
    <circle cx="16" cy="16" r="2.2" style="fill:var(--free)"/>
    <rect x="21.5" y="3" width="7.5" height="9" rx="2.6" style="fill:var(--brand)"/>
    <rect x="21.5" y="14" width="7.5" height="15" rx="2.6" style="fill:var(--brand)" opacity=".45"/>
  </symbol>
  <!-- D. 문형: 열린 강의실 문 + 초록 손잡이 -->
  <symbol id="D" viewBox="0 0 32 32">
    <rect x="6" y="3" width="20" height="26" rx="4" style="fill:var(--brand)"/>
    <path d="M14 7.5h7.5a1.5 1.5 0 0 1 1.5 1.5v14.5a1.5 1.5 0 0 1-1.5 1.5H14z" fill="#fff" opacity=".22"/>
    <circle cx="18.5" cy="16.5" r="2" style="fill:var(--free)"/>
    <rect x="3" y="27" width="26" height="2.5" rx="1.25" style="fill:var(--brand)"/>
  </symbol>
</svg>

<div class="grid" id="grid"></div>
<script>
const OPTS=[['A','2×2 정돈형','지금 로고를 같은 크기 칸으로 정리'],['B','타일형','앱 아이콘·파비콘에서 가장 또렷함'],
            ['C','시간표 열형','스플래시의 3열 시간표와 같은 모양'],['D','문형','"비어 있는 방"을 직접 표현']];
const mk=(id,s)=>`<svg width="${s}" height="${s}"><use href="#${id}"/></svg>`;
document.getElementById('grid').innerHTML=OPTS.map(([id,t,d])=>`
  <div class="opt"><h2>${id}. ${t}<span>${d}</span></h2>
  ${['','dark'].map(c=>`<div class="row ${c}">${mk(id,64)}<div class="lock">${mk(id,24)}빈강</div>
    <div class="sizes">${mk(id,32)}${mk(id,16)}</div></div>`).join('')}</div>`).join('');
</script>
</body></html>
