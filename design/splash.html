<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>빈강</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --bg:#fbfaf7; --ink:#14161b; --muted:#8a8f99; --line:#e7e5df;
  --c1:#e9e5f7; --c2:#dff0e8; --c3:#fbe9dc; --c4:#dfe9fb; --c5:#f5e3ea;
  --free:#14b37d;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111215; --ink:#f2f2f0; --muted:#80858f; --line:#2a2c31;
  --c1:#3a3560; --c2:#2a4a3c; --c3:#5a4030; --c4:#2f4266; --c5:#553544;
}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
     font-family:Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{display:flex;flex-direction:column;align-items:center}

/* 시간표 마크: 5열(월~금) × 6행 */
.mark{display:grid;grid-template-columns:repeat(5,26px);grid-template-rows:repeat(6,20px);gap:5px;
      animation:lift .7s cubic-bezier(.65,0,.25,1) 1.55s forwards}
@keyframes lift{to{transform:translateY(-10px) scale(.9)}}
.b{border-radius:7px;opacity:0;transform:translateY(6px);animation:in .45s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{to{opacity:1;transform:none}}

/* 수요일 가운데 수업이 위아래로 갈라지며 사라지고, 빈 칸이 드러난다 */
.slot{grid-column:3;grid-row:3/5;position:relative;border-radius:7px}
.slot .half{position:absolute;left:0;right:0;height:50%;background:var(--c3)}
.slot .t{top:0;border-radius:7px 7px 0 0;animation:splitT .6s cubic-bezier(.65,0,.25,1) .85s forwards}
.slot .d{bottom:0;border-radius:0 0 7px 7px;animation:splitD .6s cubic-bezier(.65,0,.25,1) .85s forwards}
@keyframes splitT{to{transform:translateY(-55%) scaleY(0);opacity:0}}
@keyframes splitD{to{transform:translateY(55%) scaleY(0);opacity:0}}
.slot .empty{position:absolute;inset:0;border:1.5px dashed var(--free);border-radius:7px;opacity:0;
             display:grid;place-items:center;animation:fade .3s ease-out 1.15s forwards}
.slot .dot{width:7px;height:7px;border-radius:50%;background:var(--free);
           box-shadow:0 0 0 0 color-mix(in srgb,var(--free) 45%,transparent);animation:pulse 1.6s ease-out 1.3s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

.name{margin-top:22px;font-size:46px;font-weight:800;letter-spacing:-.045em;line-height:1;
      opacity:0;transform:translateY(8px);animation:up .6s cubic-bezier(.2,.7,.2,1) 1.75s forwards}
.tag{margin-top:12px;font-size:14px;color:var(--muted);letter-spacing:-.01em;
     opacity:0;animation:fade .6s ease-out 2.05s forwards}
@keyframes up{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
.again{position:fixed;bottom:28px;font:inherit;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;
       opacity:0;animation:fade .4s 2.6s forwards}
.again:hover{color:var(--ink)}
</style></head>
<body>
<div class="wrap">
  <div class="mark" id="mark"></div>
  <div class="name">빈강</div>
  <div class="tag">지금 비어 있는 강의실</div>
</div>
<button class="again" onclick="location.reload()">다시 보기</button>
<script>
// [열, 시작행, 끝행, 색] — 수요일(3열) 3~4행은 갈라지는 칸으로 따로 둔다
const blocks=[[1,1,3,1],[1,3,5,4],[1,5,7,2],[2,1,2,5],[2,2,4,2],[2,4,7,1],[3,1,3,4],[3,5,7,5],[4,1,4,2],[4,4,5,3],[4,5,7,4],[5,1,2,3],[5,2,3,1],[5,3,5,5],[5,5,7,2]];
const mark=document.getElementById('mark');
blocks.forEach(([c,s,e,k],i)=>{
  const d=document.createElement('div');d.className='b';
  d.style.cssText=`grid-column:${c};grid-row:${s}/${e};background:var(--c${k});animation-delay:${.05+i*.045}s`;
  mark.appendChild(d);
});
const slot=document.createElement('div');slot.className='slot b';slot.style.animationDelay='.3s';
slot.innerHTML='<div class="empty"><div class="dot"></div></div><div class="half t"></div><div class="half d"></div>';
mark.appendChild(slot);
</script>
</body></html>
