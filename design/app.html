<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
/* 규칙: 간격 4·8·12·16·24 / 글자 13·15·17·22 / 굵기 400·600 / 모서리 8 / 강조색은 '빈 시간' 초록 하나 */
:root{
  --bg:#ffffff; --ink:#191f28; --sub:#4e5968; --muted:#8b95a1; --faint:#c4cad1; --line:#eef0f3; --fill:#f2f4f6; --raised:#ffffff;
  --free:#15a86b; --free-weak:#e3f4ec; --busy:#e3e6ea; --star:#f2a516; --brand:#4f5bd5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#17171c; --ink:#ececee; --sub:#b0b3ba; --muted:#7e838c; --faint:#4a4e56; --line:#26272d; --fill:#222329; --raised:#33353c;
  --free:#2fc584; --free-weak:#173327; --busy:#2e3037; --star:#f5b83d; --brand:#8a93f0;
}}
:root[data-theme=dark]{
  --bg:#17171c; --ink:#ececee; --sub:#b0b3ba; --muted:#7e838c; --faint:#4a4e56; --line:#26272d; --fill:#222329; --raised:#33353c;
  --free:#2fc584; --free-weak:#173327; --busy:#2e3037; --star:#f5b83d; --brand:#8a93f0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{min-height:100vh;color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
     font-size:15px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;transition:background .2s,color .2s}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:440px;margin:0 auto;min-height:100vh;position:relative}
.num{font-variant-numeric:tabular-nums}

/* ───────── 스플래시 ───────── */
.splash{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--bg);transition:opacity .4s ease}
.splash.out{opacity:0;pointer-events:none}
.wrap{display:flex;flex-direction:column;align-items:center}
.mark{display:grid;grid-template-columns:repeat(3,28px);grid-template-rows:repeat(4,22px);gap:5px;
      animation:lift .6s cubic-bezier(.65,0,.25,1) 1.5s forwards}
@keyframes lift{to{transform:translateY(-8px) scale(.92)}}
.b{border-radius:6px;background:var(--busy);opacity:0;transform:translateY(6px);animation:in .4s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
.slot{grid-column:2;grid-row:2/4;position:relative;background:none}
.slot .half{position:absolute;left:0;right:0;height:50%;background:var(--busy)}
.slot .t{top:0;border-radius:6px 6px 0 0;animation:splitT .55s cubic-bezier(.65,0,.25,1) .85s forwards}
.slot .d{bottom:0;border-radius:0 0 6px 6px;animation:splitD .55s cubic-bezier(.65,0,.25,1) .85s forwards}
@keyframes splitT{to{transform:translateY(-55%) scaleY(0);opacity:0}}
@keyframes splitD{to{transform:translateY(55%) scaleY(0);opacity:0}}
.slot .empty{position:absolute;inset:0;border:1.5px dashed var(--free);border-radius:6px;opacity:0;
             display:grid;place-items:center;animation:fade .3s ease-out 1.1s forwards}
.dot{width:6px;height:6px;border-radius:50%;background:var(--free)}
.name{margin-top:20px;font-size:36px;font-weight:700;letter-spacing:-.05em;line-height:1;
      opacity:0;transform:translateY(6px);animation:up .5s cubic-bezier(.2,.7,.2,1) 1.7s forwards}
.tag{margin-top:10px;font-size:13px;color:var(--muted);opacity:0;animation:fade .5s ease-out 1.95s forwards}
@keyframes up{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}

/* ───────── 공통 ───────── */
.screen{position:absolute;inset:0 0 auto 0;padding:0 16px calc(96px + env(safe-area-inset-bottom));opacity:0;transform:translateX(12px);pointer-events:none;
        transition:opacity .25s ease,transform .3s cubic-bezier(.2,.7,.2,1)}
.screen.on{position:relative;opacity:1;transform:none;pointer-events:auto}
.screen.left{transform:translateX(-12px)}
.top{display:flex;align-items:center;height:56px;padding-top:env(safe-area-inset-top)}
.logo{display:flex;align-items:center;gap:8px}
.lg{width:24px;height:24px;flex:none}
.word{font-size:19px;font-weight:700;letter-spacing:-.05em}
.icon{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--sub)}
.icon:active{background:var(--fill)}
.right{margin-left:auto;display:flex;margin-right:-8px}
.sec{margin-top:24px}
.sec>h3{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}

/* ───────── 건물 선택 ───────── */
.search{position:relative;display:block;margin-top:8px}
.search input{width:100%;height:44px;border-radius:8px;border:0;background:var(--fill);padding:0 12px 0 40px;font-size:15px;outline:none}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.recent{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 0;padding:0 16px}
.recent::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 12px;border-radius:8px;background:var(--fill);font-size:15px;display:flex;align-items:center;gap:6px}
.chip .code{font-size:13px;color:var(--muted)}
.bl{list-style:none}
.brow{display:flex;align-items:center}
.bitem{flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:52px;text-align:left}
.bitem:active .bname{color:var(--muted)}
.code{flex:none;width:32px;font-size:13px;color:var(--muted)}
.bname{flex:1;font-size:17px}
.bcount{font-size:13px;color:var(--muted)}
.bcount b{font-weight:600;color:var(--ink)}
.bcount.zero b{color:var(--muted);font-weight:400}
.star{flex:none;width:40px;height:44px;margin-right:-10px;display:grid;place-items:center;color:var(--faint)}
.star.on{color:var(--star)}
.zone{margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.zone>h3{font-size:15px;font-weight:600;margin-bottom:4px}
.zone>h3 span{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.none{padding:48px 0;text-align:center;color:var(--muted)}
.foot{margin-top:32px;font-size:13px;color:var(--muted)}
.foot button{color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* ───────── 빈 강의실 ───────── */
.back{margin-left:-10px}
.bcode{font-size:13px;color:var(--muted)}
.bhead h2{font-size:22px;font-weight:600;letter-spacing:-.03em;margin-top:2px}
.seg{display:grid;grid-template-columns:1.4fr repeat(5,1fr);gap:2px;margin-top:16px;padding:2px;border-radius:8px;background:var(--fill)}
.day{height:34px;border-radius:6px;font-size:15px;color:var(--sub)}
.day.on{background:var(--raised);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.time{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.tval{min-width:72px;text-align:center;font-size:22px;font-weight:600;letter-spacing:-.02em}
.icon:disabled{opacity:.3}
.head{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:16px 0 8px;border-top:1px solid var(--line)}
.head p{font-size:15px;color:var(--sub)}
.head p b{font-weight:600;color:var(--ink)}
.only{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.sw{width:36px;height:22px;border-radius:11px;background:var(--faint);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.only.on .sw{background:var(--ink)}.only.on .sw::after{transform:translateX(14px)}
.only.on .sw::after{background:var(--bg)}
.axis{position:relative;height:16px;margin-top:8px;font-size:12px;color:var(--faint)}
.axis span{position:absolute;top:0;white-space:nowrap;transform:translateX(-50%)}
.axis span:first-child{transform:none}.axis span:last-child{transform:translateX(-100%)}
.fl{margin-top:16px;padding-bottom:4px;font-size:13px;font-weight:600;color:var(--muted)}
.room{padding:12px 0 16px;border-bottom:1px solid var(--line)}
.rtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rnum{font-size:17px;font-weight:600}
.rnum small{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.stt{font-size:15px;font-weight:600;color:var(--free)}
.stt small{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.room.busy .rnum{color:var(--muted)}
.room.busy .stt{color:var(--muted);font-weight:400}
.bwrap{position:relative;margin-top:8px}
.bar{position:relative;height:8px;border-radius:4px;background:var(--free-weak);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0}
.bar .x{background:var(--busy)}
.bar .f{background:var(--free)}
.mk{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.emptyst{padding:48px 0;text-align:center;color:var(--muted)}
.emptyst p{color:var(--ink);font-weight:600;margin-bottom:4px}

/* ───────── 하단 탭 ───────── */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:5;
      display:grid;grid-template-columns:1fr 1fr;padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line)}
.tab{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--faint)}
.tab.on{color:var(--ink);font-weight:600}

/* ───────── 학사 일정 ───────── */
.ttl{font-size:22px;font-weight:600;letter-spacing:-.03em;margin-top:8px}
.ttl+p{font-size:13px;color:var(--muted);margin-top:4px}
.next{margin-top:24px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.next .k{font-size:13px;color:var(--muted)}
.next h3{font-size:22px;font-weight:600;letter-spacing:-.03em;margin-top:4px}
.next .d{font-size:15px;color:var(--sub);margin-top:4px}
.next .d b{font-weight:600;color:var(--ink);margin-left:8px}
.month{margin-top:24px;font-size:13px;font-weight:600;color:var(--muted)}
.ev{display:flex;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev .dt{flex:none;width:104px;font-size:15px;color:var(--sub)}
.ev .dt small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.ev .tt{flex:1;font-size:17px}
.ev .dd{flex:none;font-size:13px;color:var(--muted)}
.ev.now .dd{color:var(--ink);font-weight:600}
.ev.past{opacity:.4}

<div class="splash" id="splash">

<script>
/* ───── 스플래시 마크 ───── */
const blocks=[[1,1,3],[1,3,5],[2,1,2],[2,4,5],[3,1,2],[3,2,5]];
function buildMark(){
  const mark=document.getElementById('mark');mark.innerHTML='';
  blocks.forEach(([c,s,e],i)=>{const d=document.createElement('div');d.className='b';
    d.style.cssText=`grid-column:${c};grid-row:${s}/${e};animation-delay:${.05+i*.05}s`;mark.appendChild(d)});
  const slot=document.createElement('div');slot.className='slot b';slot.style.animationDelay='.3s';
  slot.innerHTML='<div class="empty"><div class="dot"></div></div><div class="half t"></div><div class="half d"></div>';mark.appendChild(slot);
}
function playSplash(ms){
  const s=document.getElementById('splash');s.classList.remove('out');
  s.querySelectorAll('.name,.tag').forEach(e=>{e.style.animation='none';e.offsetHeight;e.style.animation=''});
  buildMark();setTimeout(()=>s.classList.add('out'),ms);
}
function replay(){playSplash(2600)}

/* ───── 가짜 데이터 (지도의 건물 코드 사용, 시간표는 무작위) ───── */
const BUILDINGS=[
  ['A06','디자인미술대학'],['A07','미술관'],['A10','음악대학'],
  ['B02','상경관'],['B05','법정관'],
  ['C03','종합강의동'],['C05','인문관'],['C27','제2인문관'],['C02','외국어교육원'],
  ['E21','IT관'],['E22','전기관'],['E23','섬유관'],['E24','화공관'],['E28','소재관'],['E29','기계관'],
  ['F01','약대본관'],['F03','건축관'],['F07','건설관'],['F21','제1과학관'],['F22','제2과학관'],['F23','제3과학관'],
  ['G01','생활과학대학본관'],['G02','생활과학대학별관'],['G04','대학원'],
];
const OPEN=9*60, CLOSE=21*60;           // 시간 축 09:00–21:00
const DAYS=['월','화','수','목','금'];

function rng(seed){let h=1779033703^seed.length;for(const ch of seed){h=Math.imul(h^ch.charCodeAt(0),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
const ROOMS={};
for(const [code] of BUILDINGS){
  const r=rng(code), floors=2+Math.floor(r()*4), list=[];
  for(let f=1;f<=floors;f++){const n=2+Math.floor(r()*4);for(let k=1;k<=n;k++){
    const num=`${f}${String(k*2-1+Math.floor(r()*2)).padStart(2,'0')}`, cap=[30,40,60,80,120][Math.floor(r()*5)], week=[];
    for(let d=0;d<5;d++){const rr=rng(code+num+d), s=[];let t=OPEN;
      while(t<18*60){t+= [0,30,60,90,150,180][Math.floor(rr()*6)]; const len=rr()<.75?75:150; if(t+len>19*60)break; s.push([t,t+len]); t+=len+15}
      week.push(s)}
    list.push({num,floor:f,cap,week})}}
  ROOMS[code]=list;
}

/* ───── 판정: start <= t < end 이면 사용 중 ───── */
/* 비어 있으면 until(다음 수업 시작), 사용 중이면 freeAt(이어진 수업이 끝나는 시각) */
function status(r,day,t){
  const s=day>4?[]:r.week[day];
  const cur=s.find(([a,b])=>a<=t&&t<b);
  if(!cur){const next=s.find(([a])=>a>t);return{busy:false,until:next?next[0]:null,sess:s}}
  let e=cur[1];for(const [a,b] of s)if(a<=e&&b>e)e=b;
  return{busy:true,freeAt:e<CLOSE?e:null,sess:s};
}
const freeCount=(code,day,t)=>ROOMS[code].filter(r=>!status(r,day,t).busy).length;

/* ───── 다크 모드: 저장된 선택 > 시스템 설정 ───── */
const SUN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
const isDark=()=>(document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark';
function paintToggle(){document.querySelectorAll('.tgl').forEach(b=>b.innerHTML=isDark()?SUN:MOON)}
function toggleTheme(){const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;
  try{localStorage.setItem('bingang.theme',t)}catch{};paintToggle()}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintToggle);
paintToggle();

/* ───── 상태 · 저장 ───── */
const st={code:null,live:true,day:0,t:0,only:true};
const hm=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
function nowKST(){const d=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));return{day:(d.getDay()+6)%7,t:d.getHours()*60+d.getMinutes()}}
const list=(k)=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}};
const save=(k,a)=>{try{localStorage.setItem(k,JSON.stringify(a))}catch{}};
const store={get:()=>list('bingang.recent'),add(c){save('bingang.recent',[c,...store.get().filter(x=>x!==c)].slice(0,5))}};
const fav={get:()=>list('bingang.fav'),has:c=>fav.get().includes(c),
  toggle(c){save('bingang.fav',fav.has(c)?fav.get().filter(x=>x!==c):[...fav.get(),c])}};
const STAR_ON='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2l2.6 5.5 6 .7-4.4 4.1 1.2 5.9L12 16.5l-5.4 2.9 1.2-5.9-4.4-4.1 6-.7z"/></svg>';
const STAR_OFF='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.2l2.6 5.5 6 .7-4.4 4.1 1.2 5.9L12 16.5l-5.4 2.9 1.2-5.9-4.4-4.1 6-.7z"/></svg>';
function toggleFav(c){fav.toggle(c);renderPick();if(st.code===c)paintStar()}
function paintStar(){const b=document.getElementById('bstar'),on=fav.has(st.code);
  b.className='icon star'+(on?' on':'');b.innerHTML=on?STAR_ON:STAR_OFF;b.setAttribute('aria-pressed',on);b.onclick=()=>toggleFav(st.code)}
const name=c=>BUILDINGS.find(b=>b[0]===c)[1];

/* ───── 건물 선택 화면 ───── */
function renderPick(){
  const q=document.getElementById('q').value.trim().toLowerCase(), n=nowKST();
  const row=([c,nm])=>{const cnt=freeCount(c,n.day,n.t), on=fav.has(c);
    return `<li class="brow"><button class="bitem" onclick="go('${c}')"><span class="code num">${c}</span>
      <span class="bname">${nm}</span><span class="bcount num ${cnt?'':'zero'}">빈 강의실 <b>${cnt}</b></span></button>
      <button class="star ${on?'on':''}" onclick="toggleFav('${c}')" aria-pressed="${on}" aria-label="${nm} 즐겨찾기">${on?STAR_ON:STAR_OFF}</button></li>`};
  const favs=fav.get().filter(c=>ROOMS[c]);
  document.getElementById('favWrap').style.display=(favs.length&&!q)?'':'none';
  document.getElementById('favs').innerHTML=favs.map(c=>row([c,name(c)])).join('');
  const rec=store.get().filter(c=>ROOMS[c]&&!favs.includes(c));
  const rw=document.getElementById('recentWrap');
  rw.style.display=(rec.length&&!q)?'':'none';
  rw.innerHTML=rec.map(c=>`<button class="chip" onclick="go('${c}')"><span class="code num" style="width:auto">${c}</span>${name(c)}</button>`).join('');
  const hit=BUILDINGS.filter(([c,nm])=>!q||c.toLowerCase().includes(q)||nm.includes(q));
  const groups={};hit.forEach(b=>(groups[b[0][0]]??=[]).push(b));
  document.getElementById('zones').innerHTML=Object.keys(groups).sort().map(z=>
    `<div class="zone"><h3>${z}구역<span>${groups[z].length}곳</span></h3><ul class="bl">${groups[z].map(row).join('')}</ul></div>`).join('')
    ||'<p class="none">찾는 건물이 없어요</p>';
}

/* ───── 빈 강의실 화면 ───── */
function renderList(){
  if(st.live){const n=nowKST();st.day=n.day;st.t=n.t}
  const isWeekend=st.day>4;
  document.getElementById('bcode').textContent=st.code;
  document.getElementById('bname').textContent=name(st.code);
  paintStar();
  document.getElementById('days').innerHTML=
    `<button class="day ${st.live?'on':''}" onclick="setLive()">지금</button>`+
    DAYS.map((d,i)=>`<button class="day ${!st.live&&st.day===i?'on':''}" onclick="setDay(${i})">${d}</button>`).join('');
  document.getElementById('tval').textContent=hm(st.t);
  document.getElementById('minus').disabled=!st.live&&st.t<=OPEN;
  document.getElementById('plus').disabled=!st.live&&st.t>=CLOSE-30;

  const all=ROOMS[st.code].map(r=>({...r,...status(r,st.day,st.t)}))
    .sort((a,b)=>a.num.localeCompare(b.num,undefined,{numeric:true}));
  const free=all.filter(r=>!r.busy).length, rooms=st.only?all.filter(r=>!r.busy):all;
  document.getElementById('sum').innerHTML=`빈 강의실 <b class="num">${free}</b> / ${all.length}`;
  document.getElementById('only').classList.toggle('on',st.only);

  const pct=m=>Math.max(0,Math.min(100,(m-OPEN)/(CLOSE-OPEN)*100));
  const dur=m=>`${m>=60?Math.floor(m/60)+'시간':''}${m%60?(m>=60?' ':'')+m%60+'분':''}`;
  if(!rooms.length){document.getElementById('rooms').innerHTML=
    `<div class="emptyst"><p>이 시간엔 빈 강의실이 없어요</p>시간을 바꾸거나 '빈 곳만'을 꺼 보세요</div>`;return}

  let html=`<div class="axis num">${[9,12,15,18,21].map(h=>`<span style="left:${pct(h*60)}%">${h}</span>`).join('')}</div>`, floor=0;
  rooms.forEach(r=>{
    if(r.floor!==floor){floor=r.floor;html+=`<div class="fl">${floor}층</div>`}
    const stt=r.busy
      ?(r.freeAt?`${hm(r.freeAt)}부터 비어요`:'오늘은 계속 수업')
      :(r.until==null?`${isWeekend?'종일':'오늘 끝까지'} 비어 있음`:`${hm(r.until)}까지 비어 있어요<small>${dur(r.until-st.t)}</small>`);
    const segs=r.sess.map(([a,b])=>`<i class="x" style="left:${pct(a)}%;width:${pct(b)-pct(a)}%"></i>`).join('');
    const cur=r.busy?'':`<i class="f" style="left:${pct(st.t)}%;width:${pct(r.until??CLOSE)-pct(st.t)}%"></i>`;
    html+=`<div class="room ${r.busy?'busy':''}">
      <div class="rtop"><span class="rnum num">${r.num}호<small>${r.cap}석</small></span><span class="stt num">${stt}</span></div>
      <div class="bwrap"><div class="bar">${segs}${cur}</div><span class="mk" style="left:${pct(st.t)}%"></span></div></div>`;
  });
  document.getElementById('rooms').innerHTML=html;
}
function setLive(){st.live=true;renderList()}
function setDay(i){if(st.live){st.t=Math.min(Math.max(Math.ceil(st.t/30)*30,OPEN),CLOSE-30)}st.live=false;st.day=i;renderList()}
function stepT(d){if(st.live){const n=nowKST();st.live=false;st.day=Math.min(n.day,4);st.t=Math.floor(n.t/30)*30}
  st.t=Math.min(Math.max(st.t+d,OPEN),CLOSE-30);renderList()}
document.getElementById('minus').onclick=()=>stepT(-30);
document.getElementById('plus').onclick=()=>stepT(30);

/* ───── 학사 일정: www.yu.ac.kr/main/bachelor/calendar.do 의 calData (2026-10-28 기준, 2학기만) ───── */
const EVENTS=[
  ['2026-09-01',null,'개강'],
  ['2026-09-22','2026-09-28','추가휴학원서접수'],
  ['2026-09-29','2026-10-13','중간강의평가'],
  ['2026-09-29',null,'수업일수(1/4)'],
  ['2026-10-20','2026-10-26','중간시험'],
  ['2026-10-28',null,'수업일수(1/2)'],
  ['2026-11-24','2026-12-07','강의평가'],
  ['2026-11-24','2026-12-18','학생설계전공 신청'],
  ['2026-11-24',null,'수업일수(3/4)'],
  ['2026-12-08',null,'공휴일수업대체지정일(09.24.(목) 추석연휴일)'],
  ['2026-12-09',null,'공휴일수업대체지정일(09.25.(금) 추석연휴일)'],
  ['2026-12-10',null,'공휴일수업대체지정일(10.05.(월) 개천절 대체공휴일)'],
  ['2026-12-11',null,'공휴일수업대체지정일(10.09.(금) 한글날)'],
  ['2026-12-14','2026-12-18','기말시험'],
  ['2026-12-21','2027-02-28','방학'],
  ['2026-12-22',null,'개교기념일']
];
const WD=['일','월','화','수','목','금','토'];
/* 원문은 그대로 두고 화면에서만 줄임: 공휴일수업대체지정일(09.24.(목) 추석연휴일) → 목요일 수업 (추석 보강) */
const label=t=>{const m=t.match(/^공휴일수업대체지정일\(\d+\.\d+\.\((.)\)\s*(.+)\)$/);
  return m?`${m[1]}요일 수업 (${m[2].replace(/연휴일|대체공휴일|\s/g,'')} 보강)`:t};
const dayMs=d=>Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10));
const todayKST=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
const md=d=>`${+d.slice(5,7)}.${+d.slice(8,10)}`;
const wd=d=>WD[new Date(dayMs(d)).getUTCDay()];
function renderCal(){
  const t=dayMs(todayKST());
  const ev=EVENTS.map(([a,b,title])=>{const s=dayMs(a),e=dayMs(b||a);
    return{a,b,title:label(title),raw:title,state:e<t?'past':s<=t?'now':'next',dd:Math.round((s-t)/864e5)}});
  const up=ev.find(e=>e.state!=='past');
  const when=e=>e.b?`${md(e.a)} – ${md(e.b)}`:md(e.a);
  const wdays=e=>e.b?`${wd(e.a)} – ${wd(e.b)}`:`${wd(e.a)}요일`;
  const tag=e=>e.state==='now'?(e.b?'진행 중':'오늘'):e.state==='past'?'':e.dd===0?'오늘':`D-${e.dd}`;
  let html=up?`<div class="next"><p class="k">${up.state==='now'?(up.b?'지금 진행 중':'오늘'):'다음 일정'}</p><h3>${up.title}</h3>
    <p class="d num">${when(up)} (${wdays(up)})${up.state==='now'?'':`<b>${tag(up)}</b>`}</p></div>`:'';
  let m=0;
  ev.forEach(e=>{const mm=+e.a.slice(5,7);if(mm!==m){m=mm;html+=`<p class="month">${m}월</p>`}
    html+=`<div class="ev ${e.state}"><span class="dt num">${when(e)}<small>${wdays(e)}</small></span><span class="tt" title="${e.raw}">${e.title}</span><span class="dd num">${tag(e)}</span></div>`});
  document.getElementById('calBody').innerHTML=html;
}

/* ───── 라우팅: #E21 → 빈 강의실, 없으면 건물 선택 ───── */
function go(c){location.hash=c}
function route(){
  const c=location.hash.slice(1).toUpperCase(), sc={pick:'screen',list:'screen',cal:'screen'};
  if(c==='CAL'){renderCal();sc.cal='screen on'}
  else if(c&&ROOMS[c]){st.code=c;st.live=true;st.only=true;store.add(c);renderList();sc.pick='screen left';sc.list='screen on'}
  else{st.code=null;renderPick();sc.pick='screen on'}
  for(const id in sc)document.getElementById(id).className=sc[id];
  document.getElementById('tabRooms').classList.toggle('on',c!=='CAL');
  document.getElementById('tabCal').classList.toggle('on',c==='CAL');
  scrollTo(0,0);
}
addEventListener('hashchange',route);
document.getElementById('q').addEventListener('input',renderPick);
setInterval(()=>{if(st.live&&document.visibilityState==='visible'&&location.hash)renderList()},60000);

/* 첫 방문은 스플래시 전체, 이후엔 짧게 */
let seen=false;try{seen=sessionStorage.getItem('bingang.seen')==='1';sessionStorage.setItem('bingang.seen','1')}catch{}
playSplash(seen?1200:2600);
route();
</script>
