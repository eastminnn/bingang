services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
      YU_USERNO: ${YU_USERNO:-}
      YU_PASSWD: ${YU_PASSWD:-}
      TIMETABLE_YEAR: ${TIMETABLE_YEAR:-2026}
      TIMETABLE_SEMESTER_CODE: ${TIMETABLE_SEMESTER_CODE:-U0320021}
    depends_on:
      db:
        condition: service_healthy
    # 외부에는 Caddy만 연다. 8080은 로컬 디버깅용으로 이 컴퓨터에서만 접근
    ports:
      - "127.0.0.1:8080:8080"

  # 화면 파일과 설정은 이미지에 포함 (고친 뒤 docker compose up -d --build caddy)
  caddy:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"

  # ───── 모니터링: 모두 외부에 열지 않는다. Grafana·Prometheus는 SSH 터널로 접속 ─────
  prometheus:
    build: ./monitoring/prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    build: ./monitoring/grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD를 .env에 넣어 주세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bingang.json
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"

  # 서버 CPU·메모리·디스크 (컨테이너 안에서도 /proc의 CPU·메모리 값은 호스트 전체 기준)
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/${DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: ${DB_USER}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
