# 블루-그린 배포 (#63): api-blue와 api-green은 같은 설정이고, 배포할 때마다 번갈아 새 버전으로 바뀐다.
# 평소에는 한쪽만 떠 있다. 배포는 deploy.sh가 한다 (새 색을 띄움 → healthy 대기 → 옛 색 종료)
x-api: &api
  build: ./api
  image: bingang-api
  restart: unless-stopped
  environment:
    DB_HOST: db
    DB_NAME: ${DB_NAME}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    TZ: Asia/Seoul
    # 로그를 JSON(ECS)으로 출력해 Loki에서 레벨·로거로 검색한다 (로컬 gradle 실행은 기존 형식 유지)
    LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    YU_USERNO: ${YU_USERNO:-}
    YU_PASSWD: ${YU_PASSWD:-}
    TIMETABLE_YEAR: ${TIMETABLE_YEAR:-2026}
    TIMETABLE_SEMESTER_CODE: ${TIMETABLE_SEMESTER_CODE:-U0320021}
    # 물어보기 (#74). 키가 없으면 물어보기만 꺼진다
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-nano}
    OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT-low}
  depends_on:
    db:
      condition: service_healthy
  # 켜진 것과 요청을 받을 준비가 된 것은 다르다. DB 연결·Flyway까지 끝나 health가 UP이어야 healthy
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
    interval: 5s
    timeout: 3s
    start_period: 120s
    retries: 3
  # 끌 때 처리 중인 요청을 마칠 시간 (Spring Boot graceful shutdown)
  stop_grace_period: 30s

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # 호스트 포트는 열지 않는다. Caddy·Prometheus는 Compose 네트워크로 접근한다
  # (고정 포트를 열면 옛 색이 포트를 잡고 있는 동안 새 색이 뜨지 못한다)
  api-blue:
    <<: *api

  api-green:
    <<: *api

  # 화면 파일과 설정은 이미지에 포함 (고친 뒤 docker compose up -d --build caddy)
  caddy:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    # api에 의존하지 않는다. Caddy를 띄울 때 blue·green이 함께 켜지면 안 되고, 떠 있는 쪽은 헬스 체크로 찾는다
    ports:
      - "80:80"
      - "443:443"

  # ───── 모니터링: 모두 외부에 열지 않는다. Grafana·Prometheus는 SSH 터널로 접속 ─────
  prometheus:
    build: ./monitoring/prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    build: ./monitoring/grafana
    restart: unless-stopped
    environment:
      # 알림 메시지의 시각을 한국 시간으로
      TZ: Asia/Seoul
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD를 .env에 넣어 주세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/bingang.json
      # 알림을 보낼 디스코드 채널 웹훅. 비어 있어도 서비스는 뜨고 알림 전송만 실패한다 (Grafana 로그에 남음)
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-https://discord.invalid/webhook-not-configured}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:3000:3000"

  loki:
    build: ./monitoring/loki
    restart: unless-stopped
    volumes:
      - loki-data:/loki

  # 컨테이너 로그를 Docker 소켓으로 읽어 Loki로 보낸다 (읽기 전용)
  alloy:
    build: ./monitoring/alloy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  # 서버 CPU·메모리·디스크 (컨테이너 안에서도 /proc의 CPU·메모리 값은 호스트 전체 기준)
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/${DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: ${DB_USER}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
