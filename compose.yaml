services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
      YU_USERNO: ${YU_USERNO:-}
      YU_PASSWD: ${YU_PASSWD:-}
      TIMETABLE_YEAR: ${TIMETABLE_YEAR:-2026}
      TIMETABLE_SEMESTER_CODE: ${TIMETABLE_SEMESTER_CODE:-U0320021}
    depends_on:
      db:
        condition: service_healthy
    # 외부에는 Caddy만 연다. 8080은 로컬 디버깅용으로 이 컴퓨터에서만 접근
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"

volumes:
  db-data:
  caddy-data:
  caddy-config:
